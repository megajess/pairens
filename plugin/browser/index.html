<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>pAIrens REPL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='2' y='25' font-size='26' font-family='monospace' fill='%23e07b4c'%3E%CE%BB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script type="module" src="/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="brand">p<span class="ai">AI</span>rens</div>
      <div id="status" class="status" role="status">connecting…</div>
      <button id="disconnect" class="subtle" title="Disconnect from the Lisp image; the Lisp keeps running" hidden>⏏ disconnect</button>
      <div class="spacer"></div>
      <div class="modes" role="group" aria-label="How Claude's evals run">
        <span class="label">Claude</span>
        <button data-mode="ask" title="You approve each eval Claude wants to run">ask</button>
        <button data-mode="auto" title="Claude evals freely; every eval shows here">auto</button>
        <button data-mode="read-only" title="Claude may only inspect (describe, documentation, apropos; in Clojure doc, source, dir…)">read-only</button>
      </div>
      <div class="theme-picker">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
          <span data-icon="system" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></span><span data-icon="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span data-icon="dark" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></span><span data-icon="terminal" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16"/><path d="M7 9l3 3-3 3M12 15h5"/></svg></span>
          <span id="theme-label">Light</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="theme-menu" id="theme-menu" role="menu" aria-label="Theme" hidden>
          <li role="none"><button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-value="system" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg><span>System</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
          <li role="none"><button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-value="light" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
          <li role="none"><button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-value="dark" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span>Dark</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
          <li role="none"><button class="theme-option" type="button" role="menuitemradio" aria-checked="false" data-value="terminal" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16"/><path d="M7 9l3 3-3 3M12 15h5"/></svg><span>Terminal</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></li>
        </ul>
      </div>
    </header>

    <section id="connect" class="connect" hidden>
      <button id="launch-common-lisp" class="primary" title="Start SBCL with Swank">Launch SBCL</button>
      <button id="launch-clojure" title="Start Clojure with nREPL (Leiningen for project.clj, else the Clojure CLI)">Launch Clojure</button>
      <form id="connect-form">
        <input id="connect-addr" placeholder="port, host:port, or nrepl 7888" aria-label="Swank or nREPL address">
        <button type="submit">Connect</button>
      </form>
    </section>

    <nav class="tabs" id="tabs" aria-label="Sessions"></nav>

    <section id="cljs" class="cljs" hidden aria-label="ClojureScript"></section>

    <section id="debugs" class="debugs" aria-live="polite"></section>

    <main id="history" class="history" aria-live="polite"></main>

    <footer class="input">
      <div class="prompt"><span id="prompt">CL-USER&gt;</span><span class="hint">Enter evaluates a complete form · <code>pairens: …</code> asks Claude · Shift+Enter new line · ↑/↓ history</span></div>
      <div id="editor" class="editor"></div>
    </footer>

    <div id="offline" class="offline" hidden>
      <div class="offline-card">
        <strong>pAIrens is offline</strong>
        <p>The Claude Code session running pAIrens isn't reachable. Start it (or reopen the Claude app); this page reconnects on its own.</p>
      </div>
    </div>
  </div>
</body>
</html>
